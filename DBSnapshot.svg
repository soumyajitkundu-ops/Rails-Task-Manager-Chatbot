<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .box-green { fill: #f0fdf4; stroke: #4ade80; stroke-width: 2px; rx: 8px; }
      .box-purple { fill: #faf5ff; stroke: #c084fc; stroke-width: 2px; rx: 8px; }
      .text-title { font-family: sans-serif; font-weight: bold; font-size: 14px; fill: #0f172a; }
      .text-sub { font-family: sans-serif; font-size: 12px; fill: #475569; }
      .line { stroke: #64748b; stroke-width: 2px; fill: none; marker-end: url(#arrow); }
      .dashed-line { stroke: #94a3b8; stroke-width: 2px; fill: none; stroke-dasharray: 6; marker-end: url(#arrow); }
      .label { font-family: monospace; font-size: 12px; fill: #475569; background: white; }
      .timer-badge { fill: #e2e8f0; rx: 4px; }
    </style>
  </defs>

  <!-- Incoming Request -->
  <rect x="20" y="250" width="120" height="60" class="box" />
  <text x="80" y="285" class="text-title" text-anchor="middle">AiChatService</text>

  <!-- ChatMemory In-Memory Map -->
  <rect x="250" y="100" width="220" height="120" class="box-green" />
  <text x="360" y="130" class="text-title" text-anchor="middle">ChatMemory (STORE)</text>
  <text x="360" y="150" class="text-sub" text-anchor="middle">Concurrent::Map</text>
  <text x="360" y="175" class="text-sub" text-anchor="middle">fetch_or_load()</text>
  <text x="360" y="195" class="text-sub" text-anchor="middle">update_interaction()</text>

  <!-- ChatMemoryJobs Scheduler -->
  <rect x="250" y="320" width="220" height="150" class="box-purple" />
  <text x="360" y="350" class="text-title" text-anchor="middle">ChatMemoryJobs</text>
  <text x="360" y="370" class="text-sub" text-anchor="middle">Concurrent Scheduled Tasks</text>
  
  <rect x="270" y="390" width="180" height="30" class="timer-badge" />
  <text x="360" y="410" class="text-sub" text-anchor="middle">60s Snapshot Timer</text>
  
  <rect x="270" y="430" width="180" height="30" class="timer-badge" />
  <text x="360" y="450" class="text-sub" text-anchor="middle">120s Evict Timer</text>

  <!-- ChatMemorySnapshot DB -->
  <rect x="600" y="230" width="200" height="100" class="box" />
  <text x="700" y="270" class="text-title" text-anchor="middle">ChatMemorySnapshot</text>
  <text x="700" y="290" class="text-sub" text-anchor="middle">MySQL Database</text>
  <text x="700" y="310" class="text-sub" text-anchor="middle">persist!()</text>

  <!-- Flow Lines -->
  <!-- 1. Request -> Load -->
  <path d="M 140 280 L 200 280 L 200 160 L 250 160" class="line" />
  <text x="160" y="215" class="label">1. fetch</text>

  <!-- 2. DB fallback -->
  <path d="M 470 160 L 530 160 L 530 250 L 600 250" class="dashed-line" />
  <text x="510" y="200" class="label">if missing</text>

  <!-- 3. Schedule Jobs -->
  <path d="M 140 290 L 200 290 L 200 350 L 250 350" class="line" />
  <text x="165" y="325" class="label">2. schedule()</text>

  <!-- 4. Snapshot Task -->
  <path d="M 470 395 L 600 300" class="line" />
  <text x="495" y="335" class="label">persist</text>

  <!-- 5. Evict Task -->
  <path d="M 470 445 L 700 445 L 700 330" class="line" />
  <text x="550" y="435" class="label">persist</text>
  
  <path d="M 470 455 L 800 455 L 800 120 L 470 120" class="line" />
  <text x="550" y="110" class="label">evict() from map</text>

</svg>
